agent:
  name: Replay Agent
  description: Replay fixture for angry refund scenario.
  version: 1.0.0
  owner: qa
  domain: support
persona:
  role: Support router
  tone: calm
  verbosity: concise
  style_rules:
    - Be clear.
instructions:
  primary_goal: Route refund requests.
  secondary_goals:
    - Escalate angry users.
  do:
    - Use tools.
  do_not:
    - Do not approve refunds over 50.
constraints:
  safety:
    - Escalate angry or abusive users to human_support.
  privacy:
    - Do not expose secrets.
  compliance:
    - Follow refund policy.
  escalation:
    - Fallback to human_support when sentiment is angry or amount is 50 or more.
  data_access:
    - Only use account lookup data.
  evaluation:
    all:
      - authenticated == true
tools:
  - name: account_lookup
    description: Reads account status.
    allowed_operations:
      - read_account
    forbidden_operations: []
    requires_auth: true
    risk_level: medium
routes:
  - name: small_refund
    description: Small refund route.
    triggers:
      - refund
    target: tool:account_lookup
    priority: 10
    conditions:
      all:
        - intent == refund
        - authenticated == true
        - amount < 50
  - name: fallback_human_support
    description: Fallback for angry or high-value refund users.
    triggers:
      - angry
      - refund
      - fallback
    target: handoff:human_support
    priority: 100
    conditions:
      any:
        - sentiment == angry
        - amount >= 50
handoffs:
  - name: human_support
    condition: Angry user or high-value refund requires human review.
    destination: queue:human-support
    required_context:
      - summary
      - amount
      - sentiment
scenarios:
  - name: angry-refund-user
    input: I am angry and want a refund of 75
    context:
      intent: refund
      authenticated: true
      amount: 75
      sentiment: angry
tests: []
