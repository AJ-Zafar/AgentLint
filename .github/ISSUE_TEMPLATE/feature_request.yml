name: Feature request
description: Suggest an improvement or new capability
title: "feature: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should AgentSpec do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Spec format
        - Parser/schema
        - Linter
        - Test runner
        - Diff
        - CLI
        - VS Code extension
        - Docs
        - Integrations
